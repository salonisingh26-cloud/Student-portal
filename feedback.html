<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>

<body>

    <header>
        <h1>Feedback Form</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="course.html">Courses</a></li>
                <li><a href="feedback.html">Feedback</a></li>
                <li><a href="grades.html">Grades</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>

        <section>
            <h2>Share Your Feedback</h2>

            <p>
                Please fill in the form below to share your thoughts
                about the courses and the portal.
            </p>

            <form>

                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name">
                <br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email">
                <br><br>

                <label for="phone">Phone:</label><br>
                <input type="tel" id="phone" name="phone">
                <br><br>

                <fieldset>
                    <legend>Gender</legend>

                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </fieldset>

                <br>

                <label for="course">Select Course:</label><br>

                <select id="course" name="course">
                    <option value="html">HTML &amp; Web Fundamentals</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                </select>

                <br><br>

                <label for="feedback">Your Feedback:</label><br>

                <textarea
                    id="feedback"
                    name="feedback"
                    rows="5"
                    cols="40"></textarea>

                <br><br>

                <label for="rating">Rate the Portal:</label><br>

                <select id="rating" name="rating">
                    <option value="5">5 - Excellent</option>
                    <option value="4">4 - Very Good</option>
                    <option value="3">3 - Good</option>
                    <option value="2">2 - Average</option>
                    <option value="1">1 - Poor</option>
                </select>

                <br><br>

                <input type="checkbox" id="subscribe" name="subscribe">

                <label for="subscribe">
                    Subscribe to newsletter and updates
                </label>

                <br><br>

                <button type="submit">Submit</button>
                <button type="reset">Reset</button>

            </form>

        </section>

    </main>

    <hr>

    <footer>
        <p>© 2026 Student Portal. All rights reserved.</p>
    </footer>

</body>

</html>
